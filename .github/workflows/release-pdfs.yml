name: Generate PDF Resumes

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: bunx puppeteer browsers install chrome

      - name: Copy fonts
        run: |
          mkdir -p ~/.local/share/fonts
          find fonts -type f \( -name "*.ttf" -o -name "*.otf" -o -name "*.woff" -o -name "*.woff2" \) -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f -v

      - name: Generate PDFs
        run: bunx md-to-pdf ./masters/*.md --stylesheet styles.css --basedir ./ --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'

      - name: Upload PDFs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pdf in masters/*.pdf; do
            [ -f "$pdf" ] || continue
            echo "Uploading: $pdf"
            gh release upload "${{ github.event.release.tag_name }}" "$pdf" --clobber
          done
